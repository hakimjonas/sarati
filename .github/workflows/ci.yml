name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_OPTS: "-Xms2G -Xmx6G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"
  SBT_OPTS: "-Xms2G -Xmx6G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Check style and formatting
        run: sbt check

      - name: Compile
        run: sbt compile

      - name: Run tests
        run: sbt Test/testFull
        timeout-minutes: 10

      - name: Benchmark smoke (fat jar runnable, no measurement)
        run: |
          sbt "benchmarks/Compile/compile; benchmarks/Jmh/compile; benchmarks/assembly"
          JAR=$(find target -name "sarati-bench.jar" | head -1)
          test -n "$JAR"
          ROOT=$(dirname "$JAR")
          # sbt 2 prunes untracked files from the Compile class directory, so the JMH-generated
          # classes never survive there and sbt-assembly cannot package them. The generator's
          # durable outputs are src_managed/jmh (java sources) and resource_managed/jmh
          # (BenchmarkList). Compile the generated sources against the fat jar itself and
          # overlay both into it — deterministic, no sbt tracking involved.
          rm -rf /tmp/jmh-classes && mkdir -p /tmp/jmh-classes
          javac -cp "$JAR" -d /tmp/jmh-classes $(find "$ROOT/src_managed/jmh" -name "*.java")
          jar --update --file "$JAR" -C /tmp/jmh-classes .
          jar --update --file "$JAR" -C "$ROOT/resource_managed/jmh" META-INF
          java -jar "$JAR" -l | grep -q CodecBenchmarks
          java -jar "$JAR" "CodecBenchmarks.decodeNestedUser" -wi 0 -i 1 -f 1 -t 1
        timeout-minutes: 15

      - name: Coverage (instrumented tests + minimum threshold)
        run: sbt "coverage; Test/testFull; coverageReport"
        timeout-minutes: 15
